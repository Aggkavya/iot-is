# ACL configuration for VULNERABLE MODE

# Devices only subscribe to their commands and publish their status
user door_device
topic read iot/building/door/command
topic write iot/building/door/status

user light_device
topic read iot/building/light/command
topic write iot/building/light/status

user alarm_device
topic read iot/building/alarm/command
topic write iot/building/alarm/status

# Dashboard can read all status and write to all commands
user dashboard_user
topic read iot/building/+/status
topic write iot/building/door/command
topic write iot/building/light/command
topic write iot/building/alarm/command

# ATTACKER IS VULNERABLY ALLOWED TO PUBLISH TO ANY COMMAND TOPIC
# This simulates a lack of proper ACL enforcement for the attacker
user attacker_test
topic write iot/building/+/command
topic read iot/building/+/status
